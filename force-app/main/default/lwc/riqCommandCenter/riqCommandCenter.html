<template>
  <article class="slds-card riq-cc">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__figure">
          <lightning-icon
            icon-name="utility:heart"
            size="small"
            alternative-text=""
            class="riq-cc__icon"
          ></lightning-icon>
        </div>
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">
            <span>Customer Health Command Center</span>
          </h2>
          <p class="slds-text-body_small slds-text-color_weak">
            Where the book of business is losing health, and which renewals need attention first.
          </p>
        </div>
      </header>
    </div>

    <div class="slds-card__body slds-card__body_inner">
      <template if:true={isLoading}>
        <div class="riq-cc__state" role="status" aria-live="polite">
          <lightning-spinner alternative-text="Loading the dashboard" size="medium"></lightning-spinner>
          <p class="slds-text-body_small slds-text-color_weak riq-cc__state-text">Loading your customers…</p>
        </div>
      </template>

      <template if:true={errorMessage}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
          <span class="slds-assistive-text">Error</span>
          <h2>We could not load the dashboard.</h2>
          <p class="slds-text-body_small">{errorMessage}</p>
          <div class="slds-notify__close riq-cc__retry">
            <lightning-button label="Try again" variant="neutral" onclick={handleRetry}></lightning-button>
          </div>
        </div>
      </template>

      <template if:false={isLoading}>
        <template if:false={errorMessage}>
          <!-- KPI tiles -->
          <div class="riq-cc__kpis">
            <template for:each={kpiTiles} for:item="tile">
              <div key={tile.key} class="slds-box slds-theme_default riq-kpi" data-key={tile.key}>
                <p class="slds-text-title_caps slds-text-color_weak">{tile.label}</p>
                <p class="riq-kpi__value" title={tile.title}>{tile.value}</p>
                <p class="slds-text-body_small slds-text-color_weak">{tile.hint}</p>
              </div>
            </template>
          </div>

          <!-- Filters: every label is visible, no placeholder-only fields. -->
          <div class="riq-cc__filters slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
              <lightning-combobox
                name="owner"
                label="Owner"
                value={ownerId}
                options={ownerOptions}
                onchange={handleOwnerChange}
              ></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
              <lightning-combobox
                name="status"
                label="Status"
                value={statusFilter}
                options={statusOptions}
                onchange={handleStatusChange}
              ></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
              <lightning-combobox
                name="window"
                label="Renewal window"
                value={windowDays}
                options={windowOptions}
                onchange={handleWindowChange}
              ></lightning-combobox>
            </div>
          </div>

          <div class="slds-grid slds-wrap slds-gutters riq-cc__body">
            <!-- Status distribution -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
              <div class="slds-box slds-theme_default riq-panel">
                <h3 class="slds-text-heading_small">Status distribution</h3>

                <template if:false={chartUnavailable}>
                  <div class="riq-chart">
                    <canvas class="riq-donut" role="img" aria-label="Accounts by health status"></canvas>
                  </div>
                </template>

                <!-- SVG fallback: used when Chart.js cannot load
                                     (Lightning Web Security hiding the global,
                                     CSP, or the static resource failing). -->
                <template if:true={chartUnavailable}>
                  <svg
                    class="riq-donut-fallback"
                    viewBox="0 0 140 140"
                    role="img"
                    aria-label="Accounts by health status"
                  >
                    <circle class="riq-donut-track" cx="70" cy="70" r="54"></circle>
                    <template for:each={segments} for:item="segment">
                      <circle
                        key={segment.label}
                        class="riq-donut-segment"
                        cx="70"
                        cy="70"
                        r="54"
                        stroke={segment.color}
                        stroke-dasharray={segment.dashArray}
                        stroke-dashoffset={segment.dashOffset}
                        transform="rotate(-90 70 70)"
                      ></circle>
                    </template>
                    <text x="70" y="68" text-anchor="middle" class="riq-donut-total">{totalAccounts}</text>
                    <text x="70" y="84" text-anchor="middle" class="riq-donut-caption">accounts</text>
                  </svg>
                </template>

                <ul class="riq-legend">
                  <template for:each={segments} for:item="segment">
                    <li key={segment.label} class="riq-legend__item">
                      <span class="riq-legend__swatch" style={segment.swatchStyle}></span>
                      <lightning-icon
                        icon-name={segment.icon}
                        size="xx-small"
                        alternative-text=""
                        class="riq-legend__icon"
                      ></lightning-icon>
                      <span class="riq-legend__label">{segment.label}</span>
                      <span class="slds-text-color_weak">{segment.count} · {segment.percentage}%</span>
                    </li>
                  </template>
                </ul>
              </div>
            </div>

            <!-- Accounts needing attention -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
              <div class="slds-box slds-theme_default riq-panel">
                <div class="riq-panel__head">
                  <h3 class="slds-text-heading_small">Accounts needing attention</h3>
                  <p class="slds-text-body_small slds-text-color_weak" aria-live="polite">
                    {visibleCountText} · {sortSummary}
                  </p>
                </div>

                <template if:true={showTable}>
                  <div class="riq-table" role="region" aria-label="Accounts needing attention" tabindex="0">
                    <table class="riq-table__grid">
                      <caption class="slds-assistive-text">
                        Customers rated At Risk or Critical, lowest health score first.
                      </caption>
                      <thead>
                        <tr>
                          <template for:each={columns} for:item="column">
                            <th
                              key={column.key}
                              scope="col"
                              class={column.headerClass}
                              style={column.style}
                              aria-sort={column.ariaSort}
                            >
                              <template if:true={column.sortable}>
                                <button
                                  type="button"
                                  class="riq-sort"
                                  data-key={column.key}
                                  onclick={handleSortClick}
                                  title={column.sortTitle}
                                >
                                  {column.label}
                                </button>
                              </template>
                              <template if:false={column.sortable}>
                                <span>{column.label}</span>
                              </template>
                            </th>
                          </template>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={rows} for:item="row">
                          <tr key={row.accountId}>
                            <td class="riq-td riq-td_truncate" title={row.name}>
                              <a href={row.recordUrl} class="riq-link" title={row.name}>{row.name}</a>
                            </td>
                            <td class="riq-td riq-td_truncate" title={row.ownerName}>{row.ownerName}</td>
                            <td class="riq-td riq-td_num">{row.scoreDisplay}</td>
                            <td class="riq-td">
                              <span class="riq-badge" style={row.statusStyle}>
                                <lightning-icon
                                  icon-name={row.statusIcon}
                                  size="xx-small"
                                  alternative-text=""
                                  class="riq-badge__icon"
                                ></lightning-icon>
                                <span>{row.statusLabel}</span>
                              </span>
                            </td>
                            <td class="riq-td riq-td_num">{row.churnDisplay}</td>
                            <td class="riq-td riq-td_num" title={row.arrFull}>{row.arrDisplay}</td>
                            <td class="riq-td">{row.renewalDisplay}</td>
                            <td class="riq-td riq-td_truncate" title={row.lastScoredDisplay}>{row.lastScoredDisplay}</td>
                            <td class="riq-td riq-td_actions">
                              <button
                                type="button"
                                class="riq-icon-button"
                                data-id={row.accountId}
                                data-name={row.name}
                                onclick={handleRecalculate}
                                title={row.recalculateLabel}
                              >
                                <lightning-icon
                                  icon-name="utility:refresh"
                                  size="x-small"
                                  alternative-text={row.recalculateLabel}
                                ></lightning-icon>
                              </button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

                <template if:true={showEmpty}>
                  <div class="riq-empty">
                    <lightning-icon icon-name="utility:check" size="small" alternative-text=""></lightning-icon>
                    <p class="slds-text-body_regular">No customers match these filters.</p>
                    <p class="slds-text-body_small slds-text-color_weak">
                      Try clearing a filter or widening the renewal window.
                    </p>
                    <lightning-button
                      label="Clear filters"
                      variant="neutral"
                      onclick={handleClearFilters}
                    ></lightning-button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </template>
    </div>
  </article>
</template>
